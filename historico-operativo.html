<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
  .load-state{max-width:1520px;margin:0 auto;padding:14px 24px;font-size:13.5px;color:var(--text-secondary);}
  .load-state.load-error{color:var(--bad);font-weight:600;}
</style><title>Histórico Operativo · Post-Sales-Operations</title></head><body>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7;
    --surface:#fcfcfb;
    --surface-raised:#ffffff;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;
    --grid:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --border-strong:rgba(11,11,11,0.16);
    --series-1:#2a78d6;
    --series-1-soft:rgba(42,120,214,0.14);
    --series-2:#eb6834;
    --series-2-soft:rgba(235,104,52,0.14);
    --series-3:#1baf7a;
    --series-3-soft:rgba(27,175,122,0.14);
    --series-4:#7c5cff;
    --series-4-soft:rgba(124,92,255,0.14);
    --good:#006300;
    --bad:#d84343;
    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -12px rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --surface-raised:#212120;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --baseline:#383835;
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
      --series-1:#3987e5; --series-1-soft:rgba(57,135,229,0.18);
      --series-2:#d95926; --series-2-soft:rgba(217,89,38,0.18);
      --series-3:#199e70; --series-3-soft:rgba(25,158,112,0.18);
      --series-4:#8f74ff; --series-4-soft:rgba(143,116,255,0.18);
      --good:#0ca30c; --bad:#e0605f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-raised:#212120;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --series-1:#3987e5; --series-1-soft:rgba(57,135,229,0.18);
    --series-2:#d95926; --series-2-soft:rgba(217,89,38,0.18);
    --series-3:#199e70; --series-3-soft:rgba(25,158,112,0.18);
    --series-4:#8f74ff; --series-4-soft:rgba(143,116,255,0.18);
    --good:#0ca30c; --bad:#e0605f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:14.5px;}
  .wrap{max-width:1520px;margin:0 auto;padding:28px 24px 64px;}

  .active-filter-banner{display:flex;align-items:center;gap:8px;background:var(--series-1-soft);border:1px solid var(--series-1);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--text-primary);line-height:1.5;}
  .active-filter-banner strong{color:var(--series-1);}

  .tab-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:0;}
  .tab-btn{appearance:none;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;transition:background .12s,color .12s;margin-bottom:-2px;}
  .tab-btn:hover{color:var(--text-primary);background:var(--surface-raised);}
  .tab-btn.active{color:var(--series-1);background:var(--surface);border-color:var(--border);border-bottom:2px solid var(--surface);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* Simulador */
  .sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:14px;}
  .sim-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .sim-card h4{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .sim-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:12.5px;color:var(--text-secondary);}
  .sim-row input[type=number]{width:82px;background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;font-size:12.5px;color:var(--text-primary);font-family:inherit;text-align:right;}
  .sim-out{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .sim-out .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sim-out .cmp{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .sim-note{font-size:12px;color:var(--text-muted);background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;margin-top:6px;}
  .mixbar{display:flex;height:20px;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin:4px 0;}
  .mixbar span{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}
  .lever-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .lever-list li{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--series-3);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--text-secondary);}
  .lever-list li b{color:var(--text-primary);}
  .changes-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;}
  select.sort-select{background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text-primary);font-family:inherit;}

  /* Detalle por campaña — acordeón mensual */
  tr.camp-row{cursor:pointer;}
  tr.camp-row:hover td{background:var(--surface-raised);}
  tr.camp-row.expanded td{background:var(--series-1-soft);}
  .camp-toggle{display:inline-block;width:14px;color:var(--text-muted);transition:transform .15s;font-size:10px;}
  tr.camp-row.expanded .camp-toggle{transform:rotate(90deg);}
  .camp-ag-badges{display:flex;flex-wrap:wrap;gap:4px;}
  tr.camp-detail-row.collapsed{display:none;}
  .camp-detail{padding:14px 16px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:4px 0 8px;}
  .camp-detail h5{margin:14px 0 8px;font-size:11.5px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;}
  .camp-detail h5:first-child{margin-top:0;}
  .camp-detail h5 small{text-transform:none;font-weight:500;color:var(--text-muted);letter-spacing:0;margin-left:6px;font-size:11px;}
  .camp-detail-note{font-size:12px;color:var(--text-secondary);margin-bottom:4px;}

  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:20px;}
  header.top h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  header.top p{margin:0;color:var(--text-secondary);font-size:13.5px;max-width:62ch;}
  header.top .subtitle{margin:0 0 8px;color:var(--series-1);font-size:13px;font-weight:700;letter-spacing:.01em;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text-secondary);background:var(--surface-raised);border:1px solid var(--border);padding:6px 10px;border-radius:999px;white-space:nowrap;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--series-3);}
  .badge.warn .dot{background:var(--series-2);}
  .badge.bad{color:var(--bad);border-color:var(--bad);}
  .badge.bad .dot{background:var(--bad);}
  .badge-stack{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--series-3);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--text-secondary);font-size:13px;line-height:1.55;}
  .banner.good{border-left-color:var(--series-3);}
  .banner.bad{border-left-color:var(--bad);}
  .banner.warn{border-left-color:var(--series-2);}
  .banner strong{color:var(--text-primary);}
  .banner svg{flex:none;margin-top:2px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);}
  .panel + .panel{margin-top:16px;}
  .panel h2{font-size:14.5px;font-weight:700;margin:0 0 12px;letter-spacing:.01em;color:var(--text-primary);}
  .panel h2 small{font-weight:500;color:var(--text-muted);margin-left:6px;font-size:12px;}

  .filters{margin-bottom:16px;}
  .filter-row{display:flex;flex-direction:column;gap:10px;}
  .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{appearance:none;border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--text-secondary);font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .12s,color .12s,border-color .12s;display:inline-flex;align-items:center;gap:6px;}
  .pill:hover{border-color:var(--series-1);}
  .pill.active{background:var(--series-1);border-color:var(--series-1);color:#fff;}
  .pill .sw{width:8px;height:8px;border-radius:2px;flex:none;}
  .pill.month{padding:6px 10px;}
  .pill.month.partial{border-style:dashed;}
  .search{flex:1;min-width:200px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text-primary);font-family:inherit;}
  .search::placeholder{color:var(--text-muted);}

  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
  .kpi .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:8px;}
  .kpi .val{font-size:22px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;color:var(--text-primary);}
  .kpi .sub{font-size:11.5px;color:var(--text-secondary);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);font-weight:800;padding:8px 10px;border-bottom:2px solid var(--border-strong);white-space:nowrap;background:var(--surface-raised);}
  thead th.month-total{color:var(--text-primary);border-left:1px dashed var(--border-strong);}
  thead th.num, tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  thead th[data-key]{cursor:pointer;position:relative;}
  thead th[data-key]:hover{color:var(--text-primary);}
  thead th[data-key]::after{content:'↕';margin-left:5px;opacity:.32;font-size:9px;}
  thead th[data-key].sort-desc::after{content:'▼';opacity:1;color:var(--series-1);}
  thead th[data-key].sort-asc::after{content:'▲';opacity:1;color:var(--series-1);}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-primary);vertical-align:middle;}
  tbody tr:hover{background:var(--series-1-soft);}
  tbody tr.total-row{font-weight:700;background:var(--surface-raised);}
  td.nm{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .table-scroll{overflow-x:auto;}
  .rate-pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--series-3-soft);color:var(--series-3);}
  .rate-pill.mid{background:var(--series-2-soft);color:var(--series-2);}
  .rate-pill.low{background:rgba(216,67,67,0.13);color:var(--bad);}
  .empty-state{padding:30px;text-align:center;color:var(--text-muted);font-size:13px;}
  .spark{display:block;}

  .ag-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--text-secondary);white-space:nowrap;}
  .ag-tag .sw{width:8px;height:8px;border-radius:2px;flex:none;}

  .panel-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .panel-toolbar h2{margin:0;}
  .btn-copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--text-primary);font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .btn-copy:hover{border-color:var(--series-1);color:var(--series-1);}

  /* agent-group cards */
  .ag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .ag-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface-raised);border-top:4px solid var(--series-1);}
  .ag-card h3{font-size:13px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .ag-card .big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;}
  .ag-card .mom{font-size:11px;margin-top:2px;margin-bottom:8px;}
  .ag-card .funnel{display:flex;gap:10px;margin:10px 0;font-size:11px;color:var(--text-secondary);}
  .ag-card .funnel b{color:var(--text-primary);display:block;font-size:13px;}
  .ag-card svg.mini{width:100%;height:44px;display:block;margin-top:6px;}

  .delta-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
  .delta-pill.down{background:rgba(216,67,67,0.13);color:var(--bad);}
  .delta-pill.up{background:var(--series-3-soft);color:var(--series-3);}
  .delta-pill.flat{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}
  td.trk-flag-down{background:rgba(216,67,67,0.13);color:var(--bad);font-weight:700;}
  td.trk-flag-up{background:var(--series-3-soft);color:var(--series-3);font-weight:700;}
  .trk-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px;}
  .trk-summary-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:12px;padding:13px 15px;}
  .trk-summary-card h4{margin:0 0 8px;font-size:12.5px;font-weight:700;}
  .trk-summary-line{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:6px;}
  .trk-summary-line:last-child{margin-bottom:0;}
  .trk-summary-line b{color:var(--text-primary);}
  .na{color:var(--text-muted);font-size:11px;}

  .heat{border-radius:4px;font-weight:600;}
  .heat-na{color:var(--text-muted);font-weight:400;}
  .heat-abs{display:block;font-size:9.5px;font-weight:500;opacity:.8;margin-top:1px;}
  td.total-cell{font-weight:700;background:var(--surface-raised);border-left:1px dashed var(--border-strong);}
  .month-scope-note{font-size:11.5px;color:var(--text-secondary);margin:0 0 10px;padding:6px 10px;background:var(--surface-raised);border-radius:7px;border:1px solid var(--border);}
  .kpi .sub b{color:var(--text-secondary);font-weight:700;}
  .idx-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--text-muted);margin-top:12px;}
  .idx-legend .bar{width:130px;height:8px;border-radius:4px;background:linear-gradient(90deg, hsla(0,70%,50%,0.5), hsla(65,70%,50%,0.5), hsla(130,70%,50%,0.5));}
  h3.sub-h{font-size:12.5px;font-weight:700;color:var(--text-primary);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--border);}
  h3.sub-h:first-of-type{margin-top:0;padding-top:0;border-top:none;}

  /* alerts (reused pattern) */
  .alerts-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .alerts-head h2{margin:0;}
  .alerts-count{font-size:11.5px;font-weight:700;color:var(--text-secondary);background:var(--surface-raised);border:1px solid var(--border);padding:4px 10px;border-radius:999px;}
  .alert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:980px){.alert-grid{grid-template-columns:1fr;}}
  .alert-card{border-radius:12px;padding:14px 16px;border:1px solid var(--border);background:var(--surface-raised);}
  .alert-card.sev-high{border-left:4px solid var(--bad);}
  .alert-card.sev-med{border-left:4px solid var(--series-2);}
  .alert-card.sev-info{border-left:4px solid var(--series-1);}
  .alert-card .ahd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .alert-card .ahd .n{font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:600;}
  .alert-card .adesc{font-size:11.5px;color:var(--text-secondary);margin-bottom:10px;line-height:1.5;}
  .alert-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .alert-card li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:12px;padding:6px 8px;background:var(--surface);border-radius:7px;border:1px solid var(--border);}
  .alert-card li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);}
  .alert-card li .mt{flex:none;color:var(--text-muted);font-variant-numeric:tabular-nums;font-size:11.5px;}
  .alert-card li .diag{flex-basis:100%;color:var(--text-secondary);font-size:11px;line-height:1.4;padding-top:2px;border-top:1px dashed var(--border);margin-top:2px;}
  .alert-empty{font-size:12px;color:var(--text-muted);padding:8px 0;}

  .dq-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .dq-item{display:flex;justify-content:space-between;font-size:12px;padding:6px 10px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;}

  details.detail-toggle{margin-top:14px;}
  details.detail-toggle summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--series-1);padding:6px 0;}
  details.detail-toggle summary:hover{text-decoration:underline;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text-primary);color:var(--page);font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .copy-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .copy-overlay[hidden]{display:none;}
  .copy-box{background:var(--surface-raised);border-radius:12px;padding:18px;max-width:640px;width:100%;box-shadow:var(--shadow);}
  .copy-box h3{margin:0 0 8px;font-size:14px;}
  .copy-box p{margin:0 0 10px;font-size:12px;color:var(--text-secondary);}
  .copy-box textarea{width:100%;height:160px;font-family:ui-monospace,monospace;font-size:11px;padding:8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--page);color:var(--text-primary);}

  footer.foot{margin-top:28px;color:var(--text-muted);font-size:11.5px;line-height:1.6;border-top:1px solid var(--border);padding-top:14px;}

  tr.month-divider td{background:var(--surface-raised);font-size:11.5px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;border-top:1px solid var(--border);}

<script id="h2AppScript">
(function(){
  'use strict';
  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  const fmt0 = v => v==null ? '—' : Math.round(v).toLocaleString('es-CO');
  const fmtMoney = v => v==null ? '—' : '$'+Math.round(v).toLocaleString('es-CO');
  const fmtMoneyK = v => v==null ? '—' : (Math.abs(v)>=1000 ? '$'+(v/1000).toFixed(0)+'K' : '$'+Math.round(v));
  const fmtPct1 = v => v==null ? '—' : (v*100).toFixed(1)+'%'; // los % de HD_DATA vienen como fracción (0.49 = 49%)
  const fmtSignedPct1 = v => v==null ? '—' : (v>=0?'+':'')+v.toFixed(1)+'%';
  const MES_ES = {'01':'Ene','02':'Feb','03':'Mar','04':'Abr','05':'May','06':'Jun','07':'Jul','08':'Ago','09':'Sep','10':'Oct','11':'Nov','12':'Dic'};
  const monthLabel = ym => { const [y,m] = ym.split('-'); return MES_ES[m]+' '+y.slice(2); };

  const OP_META = {
    upsell:       {label:'2.1.- Upsell',                              color:'var(--series-1)'},
    recurrence:   {label:'Recurrence',                                 color:'var(--series-2)'},
    bootcamp:     {label:'Bootcamp',                                   color:'var(--series-3)'},
    resurrection: {label:'Resurrection',                               color:'var(--series-4)'},
    post_subtotal:{label:'Recurrence+Bootcamp+Resurrection (subtotal)',color:'var(--text-muted,#9a9a94)'},
  };
  const METRIC_META = {
    revenue:      {label:'Revenue ($)',            fmt:fmtMoney,  fmtK:fmtMoneyK, isPct:false},
    ventas:       {label:'Ventas (unidades)',       fmt:fmt0,      fmtK:fmt0,      isPct:false},
    asp:          {label:'ASP — precio prom. ($)',  fmt:fmtMoney,  fmtK:fmtMoney,  isPct:false},

  /* ---------- helpers SVG / tooltip (copia reducida del mismo patrón que ct_app.js) ---------- */
  function svg(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) if (attrs[k]!=null) el.setAttribute(k, attrs[k]);
    return el;
  }
  let tipEl = null;
  function ensureTip(){
    if (tipEl) return tipEl;
    tipEl = document.createElement('div');
    tipEl.className = 'ct-tooltip';
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function showTip(x,y,html){ const t=ensureTip(); t.innerHTML=html; t.style.left=x+'px'; t.style.top=y+'px'; t.classList.add('show'); }
  function hideTip(){ if (tipEl) tipEl.classList.remove('show'); }

  function renderLineChart(container, series, opts){
    opts = opts || {};
    const W = opts.width||760, H = opts.height||230, PAD = {l:opts.padLeft||58,r:14,t:14,b:26};
    const allY = series.flatMap(s=>s.points.map(p=>p.y)).filter(v=>v!=null);
    let yMin = opts.yMin!=null?opts.yMin:Math.min(0,...allY);
    let yMax = opts.yMax!=null?opts.yMax:Math.max(...allY);
    if (yMax===yMin) yMax = yMin+1;
    const n = Math.max(...series.map(s=>s.points.length));
    const xAt = i => PAD.l + (i/(Math.max(n-1,1))) * (W-PAD.l-PAD.r);
    const yAt = v => H-PAD.b - ((v-yMin)/(yMax-yMin)) * (H-PAD.t-PAD.b);
    const root = svg('svg', {viewBox:`0 0 ${W} ${H}`, class:'ct-chart', preserveAspectRatio:'xMidYMid meet'});
    for (let g=0; g<=4; g++){
      const v = yMin + (yMax-yMin)*g/4, y = yAt(v);
      root.appendChild(svg('line',{x1:PAD.l,x2:W-PAD.r,y1:y,y2:y,stroke:'var(--border)','stroke-width':1,'stroke-dasharray':g===0?'0':'2,3'}));
      const t = svg('text',{x:PAD.l-6,y:y+3,'text-anchor':'end','font-size':9,fill:'var(--text-secondary)'});
      t.textContent = opts.yFormat ? opts.yFormat(v) : Math.round(v);
      root.appendChild(t);
    }
    if (opts.refLine!=null){
      const y = yAt(opts.refLine);
      root.appendChild(svg('line',{x1:PAD.l,x2:W-PAD.r,y1:y,y2:y,stroke:'var(--bad)','stroke-width':1.3,'stroke-dasharray':'4,3',opacity:.7}));
    }
    series.forEach(s => {
      const pts = s.points.map((p,i)=>[xAt(i), p.y==null?null:yAt(p.y)]).filter(p=>p[1]!=null);
      if (pts.length>1){
        const d = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
        root.appendChild(svg('path',{d, fill:'none', stroke:s.color, 'stroke-width':s.width||2, 'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':s.dash||''}));
      }
      s.points.forEach((p,i) => {
        if (p.y==null) return;
        const cx = xAt(i), cy = yAt(p.y);
        const c = svg('circle',{cx,cy,r:3,fill:s.color,opacity:0.001});
        c.addEventListener('mouseenter', e => { c.setAttribute('opacity','1'); showTip(e.clientX, e.clientY-8, `<strong>${s.label}</strong><br>${p.label||''}: ${opts.tipFormat?opts.tipFormat(p.y):p.y}`); });
        c.addEventListener('mousemove', e => showTip(e.clientX, e.clientY-8, `<strong>${s.label}</strong><br>${p.label||''}: ${opts.tipFormat?opts.tipFormat(p.y):p.y}`));
        c.addEventListener('mouseleave', () => { c.setAttribute('opacity','0.001'); hideTip(); });
        root.appendChild(c);
      });
    });
    if (opts.xLabels){
      const step = Math.ceil(opts.xLabels.length/10);
      opts.xLabels.forEach((lbl,i) => {
        if (i%step!==0 && i!==opts.xLabels.length-1) return;
        const t = svg('text',{x:xAt(i),y:H-6,'text-anchor':'middle','font-size':9,fill:'var(--text-secondary)'});
        t.textContent = lbl; root.appendChild(t);
      });
    }
    container.innerHTML=''; container.appendChild(root);
    if (opts.legend){
      const lg = document.createElement('div'); lg.className='ct-legend';
      lg.innerHTML = series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('');
      if (opts.refLine!=null) lg.innerHTML += `<span><i style="background:var(--bad)"></i>${opts.refLineLabel||'Referencia'}</span>`;
      container.appendChild(lg);
    }
  }

  function renderBarChart(container, bars, opts){
    opts = opts||{};
    const W = opts.width||760, H = opts.height||210, PAD={l:opts.padLeft||58,r:14,t:14,b:28};
    const vals = bars.map(b=>b.value).filter(v=>v!=null);
    const yMax = Math.max(0, ...vals), yMin = Math.min(0, ...vals);
    const range = (yMax-yMin)||1;
    const yAt = v => H-PAD.b - ((v-yMin)/range)*(H-PAD.t-PAD.b);
    const zeroY = yAt(0);
    const bw = (W-PAD.l-PAD.r)/bars.length;
    const root = svg('svg',{viewBox:`0 0 ${W} ${H}`, class:'ct-chart'});
    for (let g=0; g<=4; g++){
      const v = yMin+range*g/4, y=yAt(v);
      root.appendChild(svg('line',{x1:PAD.l,x2:W-PAD.r,y1:y,y2:y,stroke:'var(--border)','stroke-width':1,'stroke-dasharray':g===0?'0':'2,3'}));
      const t = svg('text',{x:PAD.l-6,y:y+3,'text-anchor':'end','font-size':9,fill:'var(--text-secondary)'});
      t.textContent = opts.yFormat?opts.yFormat(v):Math.round(v);
      root.appendChild(t);
    }
    bars.forEach((b,i) => {
      if (b.value==null) return;
      const x = PAD.l + i*bw + bw*0.15, w = bw*0.7;
      const y0=zeroY, y1=yAt(b.value);
      const y=Math.min(y0,y1), h=Math.max(1,Math.abs(y1-y0));
      const rect = svg('rect',{x,y,width:w,height:h,rx:2,fill:b.color||'var(--series-1)'});
      rect.addEventListener('mouseenter', e => showTip(e.clientX, e.clientY-8, `<strong>${b.label}</strong><br>${opts.tipFormat?opts.tipFormat(b.value):b.value}`));
      rect.addEventListener('mousemove', e => showTip(e.clientX, e.clientY-8, `<strong>${b.label}</strong><br>${opts.tipFormat?opts.tipFormat(b.value):b.value}`));
      rect.addEventListener('mouseleave', hideTip);
      root.appendChild(rect);
    });
    if (opts.xLabels){
      bars.forEach((b,i) => {
        const t = svg('text',{x:PAD.l+i*bw+bw/2,y:H-6,'text-anchor':'middle','font-size':9,fill:'var(--text-secondary)'});
        t.textContent = b.xLabel||''; root.appendChild(t);
      });
    }
    container.innerHTML=''; container.appendChild(root);
    if (opts.legend){
      const lg = document.createElement('div'); lg.className='ct-legend';
      lg.innerHTML = opts.legend.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('');
      container.appendChild(lg);
    }
  }

  /* ---------- datos derivados ---------- */
  const MONTHS = HIST_DATA.months; // más reciente primero, ej. ['2026-09','2026-08',...,'2024-04']
  const N = MONTHS.length;
  const LATEST_PARTIAL_IDX = 0; // 2026-09, mes en curso
  const LATEST_COMPLETE_IDX = 1; // 2026-08
  function opSeries(opKey, metricKey){ return HIST_DATA.ops[opKey][metricKey]; }
  function totalSeries(metricKey){
    // Total Post-Venta real = Upsell + Recurrence + Bootcamp + Resurrection (NO usar post_subtotal, que excluye Upsell)
    const parts = ['upsell','recurrence','bootcamp','resurrection'].map(k=>opSeries(k,metricKey));
    const out = [];
    for (let i=0;i<N;i++){
      let sum=null, any=false;
      parts.forEach(arr=>{ if (arr[i]!=null){ sum=(sum||0)+arr[i]; any=true; } });
      out.push(any?sum:null);
    }
    return out;
  }
  function pctChange(curr, prev){ if (curr==null||prev==null||prev===0) return null; return 100*(curr-prev)/prev; }

  /* ================= VISTA RESUMEN ================= */
  function renderResumen(){
    const el = $('#h2ViewResumen');
    el.innerHTML = `
      <div class="ct-filter-row">
        <label style="font-size:12px;color:var(--text-secondary)">Operación</label>
        <select class="ct-select" id="h2ResumenOpSel"></select>
      </div>
      <div class="ct-kpi-grid" id="h2ResumenKpis"></div>
      <div class="ct-card">
        <h3>Revenue mensual histórico — ${monthLabel(MONTHS[MONTHS.length-1])} a ${monthLabel(MONTHS[0])}</h3>
        
        <div id="h2ResumenChart"></div>
      </div>
      <div class="ct-note">"Recurrence+Bootcamp+Resurrection (subtotal)" no se suma aparte del total — ya está incluido dentro del total Post-Venta mostrado arriba. Sales Chat y 1.5.-Bootcamp no tienen historia mensual en este archivo (no aparecen en ninguna pestaña de histórico), así que no están en este total.</div>
    `;
    const sel = $('#h2ResumenOpSel');
    Object.keys(OP_META).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=OP_META[k].label; sel.appendChild(o); });
    sel.value = 'upsell';

    function draw(){
      const opKey = sel.value;
      const kpis = [];
      ['revenue','ventas','asp','cr_2min'].forEach(mKey => {
        const meta = METRIC_META[mKey];
        const arr = opSeries(opKey, mKey);
        const curr = arr[LATEST_COMPLETE_IDX], prior = arr[LATEST_COMPLETE_IDX+1];
        const yoyIdx = LATEST_COMPLETE_IDX+12;
        const yoy = yoyIdx<N ? arr[yoyIdx] : null;
        const mom = pctChange(curr, prior), yoyPct = pctChange(curr, yoy);
        kpis.push(`<div class="ct-kpi">
          <div class="lbl">${meta.label} · ${monthLabel(MONTHS[LATEST_COMPLETE_IDX])}</div>
          <div class="val">${meta.fmt(curr)}</div>
          <div class="sub">Vs ${monthLabel(MONTHS[LATEST_COMPLETE_IDX+1])}: ${mom==null?'—':fmtSignedPct1(mom)} &nbsp;·&nbsp; Vs ${monthLabel(MONTHS[yoyIdx]||'')} (año ant.): ${yoyPct==null?'—':fmtSignedPct1(yoyPct)}</div>
        </div>`);
      });
      $('#h2ResumenKpis').innerHTML = kpis.join('');

      const xLabels = MONTHS.slice().reverse().map(monthLabel);
      const series = Object.keys(OP_META).filter(k=>k!=='post_subtotal').map(k => ({
        label: OP_META[k].label, color: OP_META[k].color,
        points: opSeries(k,'revenue').slice().reverse().map((y,i)=>({y, label: monthLabel(MONTHS.slice().reverse()[i])})),
      }));
      series.push({
        label:'Total Post-Venta (4 operaciones)', color:'var(--text-primary)', width:2.6,
        points: totalSeries('revenue').slice().reverse().map((y,i)=>({y, label: monthLabel(MONTHS.slice().reverse()[i])})),
      });
      renderLineChart($('#h2ResumenChart'), series, {legend:true, yFormat:v=>fmtMoneyK(v), tipFormat:v=>fmtMoney(v), xLabels, height:260});
    }
    sel.addEventListener('change', draw);
    draw();
  }

  /* ================= VISTA EXPLORADOR ================= */
  function renderExplorador(){
    const el = $('#h2ViewExplorador');
    el.innerHTML = `
      <div class="ct-filter-row" id="h2ExplOpRow" style="gap:14px">
        <span style="font-size:12px;color:var(--text-secondary)">Operaciones:</span>
      </div>
      <div class="ct-filter-row">
        <label style="font-size:12px;color:var(--text-secondary)">Métrica</label>
        <select class="ct-select" id="h2ExplMetricSel"></select>
      </div>
      <div class="ct-card">
        <h3>Tendencia mensual — 30 meses</h3>
        
        <div id="h2ExplChart"></div>
      </div>
    `;
    const opRow = $('#h2ExplOpRow');
    Object.keys(OP_META).forEach(k => {
      const id = 'h2ExplOp_'+k;
      const wrap = document.createElement('label');
      wrap.style.cssText = 'display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-primary);cursor:pointer';
      wrap.innerHTML = `<input type="checkbox" id="${id}" ${k==='upsell'||k==='recurrence'?'checked':''}> <span style="display:inline-flex;align-items:center;gap:4px"><i style="width:9px;height:9px;border-radius:2px;background:${OP_META[k].color};display:inline-block"></i>${OP_META[k].label}</span>`;
      opRow.appendChild(wrap);
    });
    const metricSel = $('#h2ExplMetricSel');
    Object.keys(METRIC_META).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=METRIC_META[k].label; metricSel.appendChild(o); });
    metricSel.value = 'revenue';

    function draw(){
      const mKey = metricSel.value;
      const meta = METRIC_META[mKey];
      const activeOps = Object.keys(OP_META).filter(k => $('#h2ExplOp_'+k).checked);
      const xLabels = MONTHS.slice().reverse().map(monthLabel);
      const series = activeOps.map(k => ({
        label: OP_META[k].label, color: OP_META[k].color,
        points: opSeries(k, mKey).slice().reverse().map((y,i)=>({y, label:xLabels[i]})),
      }));
      if (!series.length){ $('#h2ExplChart').innerHTML = '<div class="ct-note">Selecciona al menos una operación.</div>'; return; }
      renderLineChart($('#h2ExplChart'), series, {legend:true, yFormat: meta.isPct? v=>(v*100).toFixed(0)+'%' : v=>meta.fmtK(v), tipFormat: meta.fmt, xLabels, height:280});
    }
    Object.keys(OP_META).forEach(k => $('#h2ExplOp_'+k).addEventListener('change', draw));
    metricSel.addEventListener('change', draw);
    draw();
  }

  /* ================= VISTA COMPARATIVA ANUAL ================= */
  function renderAnual(){
    const el = $('#h2ViewAnual');
    el.innerHTML = `
      <div class="ct-filter-row">
        <label style="font-size:12px;color:var(--text-secondary)">Operación</label>
        <select class="ct-select" id="h2AnualOpSel"></select>
        <label style="font-size:12px;color:var(--text-secondary);margin-left:10px">Métrica</label>
        <select class="ct-select" id="h2AnualMetricSel"></select>
      </div>
      <div class="ct-card">
        <h3>Comparativa por mes del año — 2024 vs 2025 vs 2026</h3>
        
        <div id="h2AnualChart"></div>
      </div>
      <div class="ct-note">Los puntos que faltan (ej. Ene-Mar 2024) no están inventados: ese mes simplemente no existe en el histórico de la hoja.</div>
    `;
    const opSel = $('#h2AnualOpSel'); const metricSel = $('#h2AnualMetricSel');
    Object.keys(OP_META).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=OP_META[k].label; opSel.appendChild(o); });
    Object.keys(METRIC_META).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=METRIC_META[k].label; metricSel.appendChild(o); });
    opSel.value='upsell'; metricSel.value='revenue';

    const MONTH_ORDER = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    function draw(){
      const opKey = opSel.value, mKey = metricSel.value;
      const meta = METRIC_META[mKey];
      const arr = opSeries(opKey, mKey);
      const byYear = {}; // year -> {month(mm): value}
      MONTHS.forEach((ym,i) => {
        const [y,m] = ym.split('-');
        byYear[y] = byYear[y] || {};
        byYear[y][m] = arr[i];
      });
      const years = Object.keys(byYear).sort();
      const colors = ['var(--series-4)','var(--series-2)','var(--series-1)'];
      const series = years.map((y,idx) => ({
        label: y, color: colors[idx%colors.length],
        points: MONTH_ORDER.map(m => ({y: byYear[y][m], label: MES_ES[m]+' '+y})),
      }));
      renderLineChart($('#h2AnualChart'), series, {legend:true, yFormat: meta.isPct? v=>(v*100).toFixed(0)+'%' : v=>meta.fmtK(v), tipFormat: meta.fmt, xLabels: MONTH_ORDER.map(m=>MES_ES[m]), height:270});
    }
    opSel.addEventListener('change', draw); metricSel.addEventListener('change', draw);
    draw();
  }

  /* ================= VISTA EXPANSIÓN ================= */
  function renderExpansion(){
    const el = $('#h2ViewExpansion');
    const arr = opSeries('upsell','expansion');
    const xLabels = MONTHS.slice().reverse().map(monthLabel);
    const first = arr[arr.length-1], lastComplete = arr[LATEST_COMPLETE_IDX];
    el.innerHTML = `
      <div class="ct-card">
        <h3>Expansión Activación → Upsell — histórico completo</h3>
        
        <div id="h2ExpansionChart"></div>
      </div>
      <div class="ct-note">De ${monthLabel(MONTHS[MONTHS.length-1])} a ${monthLabel(MONTHS[LATEST_COMPLETE_IDX])} (último mes completo) la expansión pasó de ${fmtPct1(first)} a ${fmtPct1(lastComplete)} — ${lastComplete>first?'una mejora sostenida':'una caída'} de ${fmtSignedPct1(100*(lastComplete-first))} puntos porcentuales a lo largo del período. Es una tendencia observada, no una proyección.</div>
    `;
    renderLineChart($('#h2ExpansionChart'), [
      {label:'Expansión real (mensual)', color:'var(--series-1)', points: arr.slice().reverse().map((y,i)=>({y,label:xLabels[i]}))},
    ], {refLine:0.26, refLineLabel:'Meta interna 26%', legend:true, yFormat:v=>(v*100).toFixed(0)+'%', tipFormat:fmtPct1, xLabels, height:270});
  }

  /* ================= VISTA TABLA ================= */
  function renderTabla(){
    const el = $('#h2ViewTabla');
    el.innerHTML = `
      <div class="ct-filter-row">
        <label style="font-size:12px;color:var(--text-secondary)">Operación</label>
        <select class="ct-select" id="h2TablaOpSel"></select>
      </div>
      <div class="ct-card">
        <h3>Detalle mensual completo</h3>
        
        <div style="overflow-x:auto"><table class="ct-table" id="h2TablaTable"></table></div>
      </div>
    `;
    const sel = $('#h2TablaOpSel');
    Object.keys(OP_META).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=OP_META[k].label; sel.appendChild(o); });
    sel.value='upsell';
    function draw(){
      const opKey = sel.value;
      const cols = ['calls_to_agent','ventas','revenue','asp','cr_2min','rev_per_2min'];
      let html = '<thead><tr><th>Mes</th>' + cols.map(c=>`<th class="num">${METRIC_META[c].label}</th>`).join('') + '</tr></thead><tbody>';
      MONTHS.forEach((ym,i) => {
        html += `<tr><td>${monthLabel(ym)}${i===LATEST_PARTIAL_IDX?' <small style="color:var(--text-secondary)">(parcial)</small>':''}</td>` +
          cols.map(c => {
            const v = opSeries(opKey,c)[i];
            const meta = METRIC_META[c];
            return `<td class="num">${meta.isPct ? fmtPct1(v) : meta.fmt(v)}</td>`;
          }).join('') + '</tr>';
      });
      html += '</tbody>';
      $('#h2TablaTable').innerHTML = html;
    }
    sel.addEventListener('change', draw);
    draw();
  }

  /* ================= NAV ================= */
  $$('#h2Nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('#h2Nav button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      $$('.h2-view').forEach(v=>v.classList.remove('active'));
      $(`.h2-view[data-view="${btn.dataset.view}"]`).classList.add('active');
    });
  });

  function initHist(){
    renderResumen();
    renderExplorador();
    renderAnual();
    renderExpansion();
    renderTabla();
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', initHist); else initHist();
})();

</script>

<script id="h2MetaScript">
(function(){
  var M = HIST_DATA.months, ml = function(ym){ var n=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return n[+ym.slice(5,7)-1]+' '+ym.slice(0,4); };
  var el = document.getElementById('h2AsOf'); if (el) el.textContent = ml(M[M.length-1]) + ' – ' + ml(M[0]) + ' · ' + M.length + ' meses';
  // mes más reciente con carga incompleta en el Sheet (ventas muy por debajo de los 3 meses previos)
  var u = HIST_DATA.ops.upsell, v = u.ventas, w = document.getElementById('h2Warn');
  if (w && v && v.length > 4 && v[0] != null){
    var base = v.slice(1,4).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;}), med = base[Math.floor(base.length/2)];
    if (med && v[0] < 0.5*med) w.innerHTML = '<div class="banner warn"><div><strong>' + ml(M[0]) + ' llega incompleto desde el Sheet</strong> (Upsell: ' + Math.round(v[0]).toLocaleString('es-CO') + ' ventas vs ' + Math.round(med).toLocaleString('es-CO') + ' en un mes típico). No lo uses para tendencias hasta que se complete la pestaña "Mensual Consolidado".</div></div>';
  }
})();
</script>
</body></html>
